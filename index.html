<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Air Draw App</title>
    <!-- Include MediaPipe Hands Vision JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 { margin: 5px 0; font-size: 1.5rem; }
        #container {
            position: relative;
            width: 960px;
            height: 540px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror view */
        }
        .toolbar {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }
        .btn-blue { background: #007bff; }
        .btn-green { background: #28a745; }
        .btn-red { background: #dc3545; }
        .btn-yellow { background: #ffc107; color: black; }
        .btn-clear { background: #6c757d; }
    </style>
</head>
<body>

    <h1>Virtual Air Draw (Web Version)</h1>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="960" height="540"></canvas>
    </div>

    <div class="toolbar">
        <button class="btn-blue" onclick="setColor('blue')">Blue</button>
        <button class="btn-green" onclick="setColor('green')">Green</button>
        <button class="btn-red" onclick="setColor('red')">Red</button>
        <button class="btn-yellow" onclick="setColor('yellow')">Yellow</button>
        <button class="btn-clear" onclick="clearCanvas()">Clear Board</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const drawingCanvas = document.createElement('canvas');
        drawingCanvas.width = 960;
        drawingCanvas.height = 540;
        const drawingCtx = drawingCanvas.getContext('2d');

        let currentColor = 'blue';
        let prevX = null;
        let prevY = null;

        function setColor(color) {
            currentColor = color;
        }

        function clearCanvas() {
            drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(drawingCanvas, 0, 0);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];

                const x = indexTip.x * canvasElement.width;
                const y = indexTip.y * canvasElement.height;
                const my = middleTip.y * canvasElement.height;

                const drawingMode = y < (my - 25);

                if (drawingMode) {
                    if (prevX === null || prevY === null) {
                        prevX = x;
                        prevY = y;
                    }

                    drawingCtx.strokeStyle = currentColor;
                    drawingCtx.lineWidth = 8;
                    drawingCtx.lineCap = 'round';
                    drawingCtx.lineJoin = 'round';

                    drawingCtx.beginPath();
                    drawingCtx.moveTo(prevX, prevY);
                    drawingCtx.lineTo(x, y);
                    drawingCtx.stroke();

                    prevX = x;
                    prevY = y;

                    canvasCtx.fillStyle = currentColor;
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
                    canvasCtx.fill();
                } else {
                    prevX = null;
                    prevY = null;
                    canvasCtx.strokeStyle = '#00ffff';
                    canvasCtx.lineWidth = 3;
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 10, 0, 2 * Math.PI);
                    canvasCtx.stroke();
                }
            } else {
                prevX = null;
                prevY = null;
            }
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 960,
            height: 540
        });
        camera.start();
    </script>
</body>
</html>
